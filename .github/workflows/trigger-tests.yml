name: Trigger Playwright Tests
on:
  push:
    branches:
      - main

jobs:
  trigger-tests:
    name: Trigger tests in test repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment URL
        run: echo "ENVIRONMENT=https://www.kigalihome.live/" >> $GITHUB_ENV

      - name: Log github context
        run: |
          echo "$GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}

      - name: Trigger Playwright tests in test repo
        uses: peter-evans/repository-dispatch@v2
        with:
          token: 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
          repository: tito-org-12/real-estate-e2e-test-
          event-type: run-playwright-tests
          client-payload: '{"github": ${{ toJson(github) }}, "environment": "${{ env.ENVIRONMENT }}"}'
