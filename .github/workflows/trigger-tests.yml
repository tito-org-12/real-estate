name: Trigger Playwright Tests
on:
  deployment_status

jobs:
  trigger-tests:
    runs-on: ubuntu-latest
    environment: REPO_ACCESS_TOKEN
    if: |
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.creator.login, 'vercel')
    steps:
      - name: Trigger Playwright tests
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: tito-org-12/real-estate-e2e-test-
          event-type: run-playwright-tests
          client-payload: '{"github": ${{ toJson(github) }}, "environment": "${{ github.event.deployment_status.environment_url }}"}'
          

