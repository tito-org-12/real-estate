name: Trigger Playwright Tests
on:
  deployment_status

jobs:
  trigger-tests:
    runs-on: ubuntu-latest
    environment: REPO_ACCESS_TOKEN
    steps:
      - name: Find latest store-artifact run
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          run_id=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/store-artifact.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          echo "Found run_id: $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download artifact from that run
        uses: actions/download-artifact@v4
        with:
          name: build-uuid
          path: ./downloaded
          run-id: ${{ steps.find-run.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Log artifact content
        run: |
          echo "Artifact contents:"
          cat ./downloaded/uuid.txt

      - name: Debug payload
        run: |
          echo "=================== DEPLOYMENT STATE ==================="
          echo "state:       ${{ github.event.deployment_status.state }}"
          echo "=========================================================="
          echo "environment: ${{ github.event.deployment.environment }}"
          echo "ref:         ${{ github.event.deployment.ref }}"
          echo "sha:         ${{ github.event.deployment.sha }}"
          echo "creator:     ${{ github.event.deployment_status.creator.login }}"
          echo "env_url:     ${{ github.event.deployment_status.environment_url }}"

      - name: Trigger Playwright tests
        if: >
          github.event.deployment_status.state == 'success' &&
          github.event.deployment.environment == 'Production' &&
          github.event.deployment_status.creator.login == 'vercel[bot]'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: tito-org-12/real-estate-e2e-test-
          event-type: run-playwright-tests
          client-payload: '{"github": ${{ toJson(github) }}, "environment": "${{ github.event.deployment_status.environment_url }}"}'

  wait-for-coolify:
    name: Wait for Coolify then trigger Playwright tests
    runs-on: ubuntu-latest
    env:
      DEPLOY_REF: ${{ github.event.deployment.ref }}
    steps:
      - name: Debug Coolify job fields
        run: |
          echo "=================== COOLIFY JOB FIELDS ==================="
          echo "DEPLOY_REF (env):              $DEPLOY_REF"
          echo "github.event.deployment.ref:   ${{ github.event.deployment.ref }}"
          echo "github.event.deployment.environment: ${{ github.event.deployment.environment }}"
          echo "github.event.deployment.sha:   ${{ github.event.deployment.sha }}"
          echo "github.event.deployment.creator.login: ${{ github.event.deployment.creator.login }}"
          echo "github.event.deployment_status.state:  ${{ github.event.deployment_status.state }}"
          echo "github.event.deployment_status.creator.login: ${{ github.event.deployment_status.creator.login }}"
          echo "github.event.deployment_status.environment_url: ${{ github.event.deployment_status.environment_url }}"
          echo "============================================================"

      - name: Dump full github.event payload
        env:
          FULL_EVENT: ${{ toJson(github.event) }}
        run: |
          echo "=================== FULL github.event ==================="
          echo "$FULL_EVENT"
          echo "============================================================"

      - name: Resolve branch name from deployment sha
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          echo "=================== RESOLVED BRANCH ==================="
          branch=$(gh api \
            "repos/${{ github.repository }}/commits/$DEPLOY_SHA/branches-where-head" \
            --jq '.[0].name // empty')
          echo "sha:    $DEPLOY_SHA"
          echo "branch: $branch"
          echo "=========================================================="

